[flake8]
max-line-length = 79
exclude = .venv,flask,__pycache__,migrations/versions/__pycache__
per-file-ignores =
    # Blueprint routes are registered by importing the view modules.
    api/views/__init__.py: E402,F401,F403

[tool:pytest]
testpaths = tests
filterwarnings =
    error
    # Third-party deprecations we cannot fix here.
    ignore::DeprecationWarning:flask_jwt_extended.*
