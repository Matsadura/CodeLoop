name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: CODE_DB
          MYSQL_USER: CODE_USER
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      DATABASE_URL: mysql+pymysql://CODE_USER:ci-password@127.0.0.1:3306/CODE_DB
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough
      JUDGE0_URL: http://judge0.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8
      - name: Unit tests
        run: python -m pytest -q
      - name: Migrations apply cleanly on MySQL and match the models
        run: |
          python manage.py wait-db --timeout 60
          python manage.py migrate
          python manage.py check-schema

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api

  docker:
    name: Production images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target prod -t codeloop-api:ci server
      - name: Build web image
        run: docker build --target prod -t codeloop-web:ci client
      - name: Validate compose files
        run: |
          docker compose config -q
          cp .env.production.example .env.ci
          sed -i 's/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=x/; s/^MYSQL_PASSWORD=$/MYSQL_PASSWORD=x/; s/^JWT_SECRET_KEY=$/JWT_SECRET_KEY=x/' .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config -q
